{{- if .Values.adminAccount.enabled }}
{{/* The administrator account's gateway (files/gateway.py, a container in the Stalwart pods) and
     its Service. Not part of the ingress, the HTTPRoute or the mail Service. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stalwart.fullname" . }}-admin-gateway
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-gateway
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  gateway.py: |
    {{- .Files.Get "files/gateway.py" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stalwart.fullname" . }}-admin
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-gateway
  annotations:
    {{- include "stalwart.annotations" (dict "specific" dict "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stalwart.serverSelectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.adminAccount.gateway.port }}
      targetPort: admin
{{- end }}

---
# Every optional feature on, with credentials from existing Secrets, to catch
# template and policy regressions across the whole chart.
dataStore:
  backend: "postgresql"
  postgresql:
    host: "postgres.database.svc.cluster.local"
    existingSecret: "stalwart-postgresql"
blobStore:
  backend: "s3"
  compression: "zstd"
  s3:
    bucket: "mail"
    existingSecret: "stalwart-s3"
provisioning:
  existingSecret: "stalwart-admin"
certificateReload:
  enabled: true
domain: "example.org"
ingress:
  enabled: true
  className: "nginx"
  tls:
    - secretName: "mail-tls"
      hosts: ["mail.example.org"]
podAntiAffinityPreset: "soft"
networkPolicy:
  enabled: true
  management:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: "ingress-nginx"
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: "monitoring"
        podSelector:
          matchLabels:
            app.kubernetes.io/name: "prometheus"
  webmail:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: "ingress-nginx"
autoscaling:
  enabled: true
  maxReplicas: 3
metrics:
  enabled: true
  auth:
    username: "prometheus"
    existingSecret: "stalwart-metrics"
  serviceMonitor:
    enabled: true
encryption:
  provision: true
  blobKey:
    existingSecret: "stalwart-blob-key"
oidc:
  enabled: true
  activate: false
  issuerUrl: "https://keycloak.example.org/realms/mail"
inMemoryStore:
  type: "redis"
  redis:
    url: "redis://valkey.cache.svc.cluster.local:6379"
coordinator:
  type: "nats"
  nats:
    hosts: ["nats.messaging.svc.cluster.local:4222"]
    existingSecret: "stalwart-nats"
webmail:
  enabled: true
  jmapServerUrl: "https://mail.example.org"
  logFormat: "json"
  oauth:
    enabled: true
    clientId: "bulwark"
    postLogoutRedirectUri: "https://webmail.example.org/en/login"
  sessionSecret:
    existingSecret: "bulwark-session"
  adminPassword:
    existingSecret: "bulwark-admin"
  ingress:
    enabled: true
    host: "webmail.example.org"
  autoscaling:
    enabled: true
    maxReplicas: 3
  podAntiAffinityPreset: "soft"
  sharedStore:
    existingSecret: "bulwark-valkey"
    keyPrefix: "mail:"
  settingsSync:
    enabled: true
  persistence:
    enabled: false
systemAccounts:
  smtpCheck:
    enabled: true
    host: "stalwart-smtp-internal"
    port: 2525
  accounts:
    - id: "mailer"
      name: "mailer"
      domain: "example.org"
      aliases: ["no-reply"]
      appPassword:
        allowedIps: ["10.0.0.0/8"]
        permissions: ["authenticate", "emailSend"]
      secret:
        name: "mailer-smtp"
        keys: ["password"]
...

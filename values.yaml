---
# Optional overrides shared with Bitnami Common image helpers.
global:
  imageRegistry: ""
  imagePullSecrets: []
  # -- Default storage class when persistence.storageClass is unset.
  defaultStorageClass: ""

# -- Overrides the chart name used in resource names.
nameOverride: ""
# -- Overrides the full resource name. Use it to keep existing resource names when upgrading from another chart.
fullnameOverride: ""

# -- Convenience base domain: when set and ingress.hosts / webmail.ingress.host
# are left at their defaults, they derive mail.<domain> and
# webmail.<domain> respectively. Set either explicitly to override this,
# or leave domain empty and set both explicitly yourself.
domain: ""

# -- Server hostname (SystemSettings.defaultHostname), applied by the
# provisioning Job; empty leaves it untouched. A new server has none, so JMAP
# session URLs point at the pod name. Usually the public mail host, e.g.
# mail.example.org. Stalwart requires a default domain with it: the Job
# creates mailDomain if missing and makes it the default. The reconcile Job
# then restarts Stalwart to apply it.
hostname: ""

# -- Default mail domain set together with hostname (SystemSettings.defaultDomainId),
# created if missing. Defaults to domain.
mailDomain: ""

# -- Existing Secret containing environment variables; also accepts STALWART_RECOVERY_ADMIN.
existingSecret: ""

# Container image.
image:
  registry: "docker.io"
  repository: "stalwartlabs/stalwart"
  # -- Image tag, kept in sync with the digest by Renovate.
  # @default -- pinned, see values.yaml
  tag: "v1.1.0"
  # -- Multi-arch index digest of the tag. Takes precedence over the tag;
  # clear it to float on the tag instead.
  # @default -- pinned, see values.yaml
  digest: "sha256:f772aa6ef8cd8018969fa491640f1436b0270eb14e2c219b5f37f1a77020837e"
  # -- A digest never changes, so a cached image is always the right one.
  pullPolicy: "IfNotPresent"
  pullSecrets: []

# -- Number of pods in the StatefulSet.
# Single-node deployments keep this at 1.
# For a clustered deployment, raise this value and set `role` (and
# `pushShard` where applicable) to a value that makes sense for the
# whole StatefulSet, or install multiple releases of this chart with
# different role values.
replicaCount: 1

# Scales replicaCount automatically instead of setting it statically.
# Every replica still gets the same `role`/`pushShard` -- this scales a
# homogeneous pool of general-purpose nodes, not differentiated cluster
# roles; use separate releases for those, as above. Requires
# resources.requests.cpu/memory to be set for the corresponding
# utilization target to mean anything.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""
  # -- Advanced: raw autoscaling/v2 metric entries, used instead of the two
  # convenience targets above when non-empty.
  metrics: []
  # -- autoscaling/v2 behavior. Scaling down drops the removed pod's IMAP and
  # SMTP sessions, so by default it removes at most one pod per five minutes,
  # after ten minutes of lower load. Set to null for the Kubernetes defaults.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: "Pods"
          value: 1
          periodSeconds: 300

# PodDisruptionBudget for the mail StatefulSet, limiting how many pods node
# drains and cluster upgrades may evict at once. Rendered only when more than
# one replica is possible (replicaCount, or autoscaling.maxReplicas, above 1).
pdb:
  # -- Create the PodDisruptionBudget for multi-replica installs.
  create: true
  # -- Pods that may be evicted at once. Ignored when minAvailable is set.
  maxUnavailable: 1
  # -- Pods that must stay available, as a number or percentage. Replaces
  # maxUnavailable when set; a value equal to the replica count blocks drains.
  minAvailable: ""

# -- Maps to STALWART_ROLE. Names a ClusterRole defined in the database.
# Leave empty on single-node installs to run every task and listener.
# See /docs/cluster/configuration/roles for the role model.
role: ""

# -- Maps to STALWART_PUSH_SHARD. Only set on nodes whose role delivers
# push notifications. Leave empty on single-node installs.
pushShard: ""

# Recovery / bootstrap administrator credential.
# Supply this on first install to allow initial administrator sign-in.
# Remove it once a permanent administrator account has been
# provisioned through the setup wizard.
recoveryAdmin:
  enabled: false
  username: "admin"
  password: ""
  # -- Preferred: key containing the complete username:password credential.
  existingSecret: ""
  secretKey: "STALWART_RECOVERY_ADMIN"

# Starts the pods in recovery mode. Suspends mail services and
# exposes only the management listener on the configured port.
# See /docs/configuration/recovery-mode.
recoveryMode:
  enabled: false
  port: 8080
  logLevel: "info"

# Select the startup DataStore; server/blob settings still live in Stalwart's database.
dataStore:
  backend: "postgresql" # postgresql or rocksdb
  rocksdb:
    path: "/var/lib/stalwart"
  postgresql:
    host: ""
    port: 5432
    database: "stalwart"
    username: "stalwart"
    useTls: true
    allowInvalidCerts: false
    # -- Existing Secret containing the database password. Falls back to
    # top-level existingSecret, then to the plain password below.
    existingSecret: ""
    passwordSecretKey: "STALWART_DB_PASSWORD"
    # -- Fallback only, stored in a chart-managed Secret and visible in
    # Helm's release history. Prefer existingSecret.
    password: ""
    poolMaxConnections: 10

# S3 is the default BlobStore; supply its bucket and existing credential Secrets.
# Select existing to preserve an externally configured BlobStore without provisioning.
blobStore:
  backend: "s3" # s3 or existing
  s3:
    bucket: ""
    # -- Stalwart region variant, e.g. EuCentral1. Ignored when custom.url is set.
    region: "EuCentral1"
    # Stalwart's Custom region, for MinIO, SeaweedFS or another S3-compatible store:
    # setting url selects it.
    custom:
      url: ""
      region: "us-east-1"
    existingSecret: ""
    accessKeyIdSecretKey: "accessKeyId"
    secretKeySecretKey: "secretKey"
    # -- Fallback only, stored in a chart-managed Secret and visible in
    # Helm's release history. Prefer existingSecret. Both are required
    # together when existingSecret is not set.
    accessKeyId: ""
    secretKey: ""
    keyPrefix: ""
    verifyAfterWrite: true
    allowInvalidCerts: false
  # -- Compression of new mail and file storage (WebDAV) blobs: lz4 (Stalwart's
  # default), zstd or none. Empty leaves the setting unchanged. Existing blobs keep
  # their compression until a BlobRecode task rewrites them. Requires provisioning credentials.
  compression: ""

# Selecting S3 runs a post-install/post-upgrade CLI Job against management.
provisioning:
  image:
    registry: "ghcr.io"
    repository: "stalwartlabs/cli"
    # -- Image tag, kept in sync with the digest by Renovate.
    # @default -- pinned, see values.yaml
    tag: "1.0.14"
    # -- Multi-arch index digest of the tag. Takes precedence over the tag;
    # clear it to float on the tag instead.
    # @default -- pinned, see values.yaml
    digest: "sha256:5b70732cb69cdab3ff0894c501544cf0bfa180fa75bcd0eeba4eebe04c1064e1"
    pullPolicy: "IfNotPresent"
    pullSecrets: []
  username: "admin"
  # -- Password for an administrator already recognized by Stalwart.
  existingSecret: ""
  passwordSecretKey: "password"
  # -- Fallback only, stored in a chart-managed Secret and visible in
  # Helm's release history. Prefer existingSecret.
  password: ""
  # -- Additional `stalwart-cli apply` operations, one object per NDJSON line,
  # appended after the chart's own (so they can reference e.g. `#keycloak`).
  # Use it for objects the chart has no option for, such as domains or the
  # server hostname; enabling it requires provisioning credentials.
  # Example:
  #   - {"@type": upsert, object: Domain, matchOn: [name], value: {main: {name: example.org}}}
  #   - {"@type": update, object: SystemSettings, value: {defaultHostname: mail.example.org, defaultDomainId: "#main"}}
  extraPlan: []
  # After the provisioning Job: restarts Stalwart when the settings plan changed (Stalwart
  # reads settings and binds listeners at startup) and publishes the app passwords of
  # systemAccounts. The only part of the chart with Kubernetes permissions: get/patch on this
  # release's StatefulSet, get/update on the system account Secrets.
  reconcile:
    image:
      registry: "docker.io"
      repository: "library/python"
      # -- Image tag, kept in sync with the digest by Renovate.
      # @default -- pinned, see values.yaml
      tag: "3.15-alpine"
      # -- Multi-arch index digest of the tag. Takes precedence over the tag;
      # clear it to float on the tag instead.
      # @default -- pinned, see values.yaml
      digest: "sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a"
      pullPolicy: "IfNotPresent"
      pullSecrets: []
    # -- How long to wait for the restarted pods to become ready.
    restartTimeoutSeconds: 600
    # -- Also how long a run's lock on a system account Secret is honored by other runs.
    activeDeadlineSeconds: 900
    backoffLimit: 6
    resources:
      requests:
        cpu: "20m"
        memory: "32Mi"
  activeDeadlineSeconds: 600
  backoffLimit: 6
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"

# System accounts for other applications, e.g. an account that only sends mail. With an
# external directory (OIDC) an administrator cannot set an account's password; Stalwart only
# accepts app passwords it generates itself. The provisioning Job creates the accounts, and the
# reconcile Job (provisioning.reconcile) creates an app password per account and writes it into
# a Secret the applications read. A new app password is only created when the recorded one no
# longer exists in Stalwart; applications pick it up when they restart. See "System accounts"
# in the README.
systemAccounts:
  # -- Accounts. Example:
  #   - id: mailer                     # stable identifier, also marks the app passwords
  #     name: mailer                   # account name; the address is name@domain
  #     domain: ""                     # default: mailDomain, then domain
  #     aliases: [no-reply]            # further local parts on the same domain
  #     permissions: [authenticate, emailSend]   # the account's only permissions; this is the
  #                                    # default when omitted, [] grants none
  #     appPassword:
  #       allowedIps: [10.0.0.0/8]     # networks the password is accepted from; include the
  #                                    # Job's pod network when smtpCheck is enabled
  #       permissions: [authenticate, emailSend]   # replaces the account's; omitted inherits them
  #     secret:
  #       create: true                 # false: an existing Secret, delegated to the Job
  #       name: mailer-smtp
  #       namespace: ""                # default: the release namespace
  #       keys: [password]             # keys that hold the password
  accounts: []
  # Checks a new or the recorded app password with SMTP AUTH, as the applications use it. A
  # failed check fails the run; it never creates another password.
  smtpCheck:
    enabled: false
    host: ""
    port: 587
    startTls: false

# Stalwart's log output (Tracer objects), applied by the provisioning Job. A new server only
# logs to /var/log/stalwart, which the read-only root file system does not keep; `console`
# logs to stdout for `kubectl logs` instead and switches that file tracer off. Stalwart reads
# tracers at startup; the reconcile Job restarts it after a change.
logging:
  console:
    enabled: true
    # -- error, warn, info, debug or trace.
    level: "info"

# Stalwart reads certificate files only at startup or on a reload: a mounted
# Secret renewed by cert-manager keeps the old certificate in use until then.
# This CronJob applies `ReloadTlsCertificates` on a schedule through the
# management Service, without restarting pods. It uses the provisioning image
# and credentials (provisioning.username/existingSecret/password).
certificateReload:
  enabled: false
  # -- Cron schedule; daily is enough, as cert-manager renews well before expiry.
  schedule: "0 3 * * *"
  # -- IANA time zone for the schedule. Empty uses the controller's time zone.
  timeZone: ""
  activeDeadlineSeconds: 300
  backoffLimit: 2
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"

# -- Advanced raw DataStore object. A nonempty object overrides dataStore selection.
config: {}

# Service definition. Change `type` to LoadBalancer when a cloud
# load balancer should expose the mail ports directly, or keep it
# as ClusterIP and front the chart with an Ingress / gateway for
# the HTTP listeners only.
service:
  enabled: true
  annotations: {}
  # -- Preserve source IPs when supported by the load balancer.
  externalTrafficPolicy: "Local"
  loadBalancerSourceRanges: []
  # -- Dual-stack: SingleStack, PreferDualStack or RequireDualStack. Empty
  # leaves the cluster default. ipFamilies (IPv4/IPv6, in order) with two
  # entries requires a *DualStack policy.
  ipFamilyPolicy: ""
  ipFamilies: []
  type: "ClusterIP"
  # Service ports map to named container ports. The defaults are what mail
  # clients need: SMTP, submission and IMAP over implicit TLS, and HTTPS.
  # Stalwart also listens on 995 (POP3S) and 4190 (ManageSieve) by default;
  # the commented entries add those or STARTTLS ports. A port here does not
  # make Stalwart listen: STARTTLS ports and 80 need a listener in Stalwart
  # first (e.g. via provisioning.extraPlan). Remove a default port by setting it
  # to null; a null for a port not listed here fails the schema.
  ports:
    smtp:
      port: 25
      containerPort: 25
      protocol: "TCP"
    smtps:
      port: 465
      containerPort: 465
      protocol: "TCP"
    imaps:
      port: 993
      containerPort: 993
      protocol: "TCP"
    # Submission with STARTTLS, for clients that do not support port 465.
    # submission:
    #   port: 587
    #   containerPort: 587
    #   protocol: "TCP"
    # IMAP with STARTTLS.
    # imap:
    #   port: 143
    #   containerPort: 143
    #   protocol: "TCP"
    # POP3 with STARTTLS.
    # pop3:
    #   port: 110
    #   containerPort: 110
    #   protocol: "TCP"
    # POP3 over TLS.
    # pop3s:
    #   port: 995
    #   containerPort: 995
    #   protocol: "TCP"
    # ManageSieve, for clients that edit filters directly.
    # sieve:
    #   port: 4190
    #   containerPort: 4190
    #   protocol: "TCP"
    # Plain HTTP, e.g. for ACME HTTP-01 challenges answered by Stalwart itself.
    # http:
    #   port: 80
    #   containerPort: 80
    #   protocol: "TCP"
    # Web UI, JMAP and DAV over TLS, for setups without an Ingress or Gateway.
    https:
      port: 443
      containerPort: 443
      protocol: "TCP"

# Ingress for the HTTP / HTTPS listeners only. Mail protocols
# require L4 exposure and are not handled here.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # -- Defaults to a single "mail.<domain>" host (HTTPS, path /) when
  # empty and top-level domain is set. Set this explicitly to override
  # that default or to declare more than one host.
  hosts: []
  tls: []
  # -- `management` (default) routes to the internal management Service:
  # Stalwart's plain HTTP listener (management.port), with TLS ending at the
  # controller. `mail` routes to the mail Service by each path's portName
  # (default `https`, Stalwart's TLS listener), which needs the controller's
  # HTTPS-upstream setting; a new server has no listener on port 80.
  backend: "management"

# Routes attach to existing Gateways; install Gateway API CRDs and a controller first.
gatewayAPI:
  httpRoute:
    enabled: false
    annotations: {}
    # -- Each reference names a Gateway; namespace and sectionName are optional.
    parentRefs: []
    hostnames: []
    # -- Mail Service port for `backend: mail`. Plain HTTP upstream, with client
    # TLS ending on the Gateway; Stalwart needs a listener on that port.
    backendPortName: "http"
    # -- `management` (default) uses the internal management Service, as for
    # ingress.backend; `mail` uses backendPortName on the mail Service.
    backend: "management"
    paths:
      - type: "PathPrefix"
        value: "/"
  # -- Use v1alpha2 for older experimental-channel TCPRoute CRDs.
  tcpRouteApiVersion: "gateway.networking.k8s.io/v1"
  # -- Keys refer to service.ports entries, with a Gateway TCP listener per mail port.
  # tcpRoutes:
  #   smtp:
  #     parentRefs:
  #       - name: mail-gateway
  #         sectionName: smtp
  #     annotations: {}
  tcpRoutes: {}

# Ingress NetworkPolicies for the Stalwart and webmail pods. Egress stays open: Stalwart
# delivers mail to the internet and queries DNS, DNSBLs, ACME and its stores; Bulwark
# reaches its JMAP server, identity provider and plugins. Kubelet probes are not affected.
networkPolicy:
  enabled: false
  mail:
    # -- NetworkPolicyPeers allowed to reach Stalwart's service.ports (mail and HTTPS).
    # Empty allows any source, since mail clients and other mail servers connect from
    # anywhere. E.g. an ipBlock for a submission-only relay network.
    from: []
  management:
    # -- NetworkPolicyPeers allowed to reach the management port (JMAP, admin API,
    # metrics), in addition to this release's own pods (webmail, provisioning and
    # reconcile Jobs). Add the ingress controller or Gateway when ingress or the
    # HTTPRoute uses the management backend, Prometheus for metrics, and other
    # in-cluster clients such as a provisioning connector.
    from: []
  webmail:
    # -- NetworkPolicyPeers allowed to reach the webmail port. Empty allows any source;
    # normally the ingress controller's or Gateway's namespace.
    from: []
  # -- Extra ingress rules appended to the Stalwart policy as written.
  extraIngress: []

# Persistent volume for the data directory. Required when the
# DataStore is a local backend such as RocksDB. Can be disabled
# for deployments that use an external store (PostgreSQL, MySQL,
# FoundationDB, S3-backed blob store, etc.).
persistence:
  # -- Disabled for external PostgreSQL/S3; enable for local durable stores.
  enabled: false
  accessMode: "ReadWriteOnce"
  # -- Empty uses the cluster default; "-" explicitly requests no storage class.
  storageClass: ""
  size: "20Gi"

# Starting requests for a small installation; tune using observed usage.
# No CPU limit by default to avoid throttling mail processing.
resources:
  requests:
    cpu: "100m"
    memory: "512Mi"

# Pod-level security context. Non-root UID/GID 2000 with RuntimeDefault seccomp by default; set `enabled: false` to omit it entirely.
podSecurityContext:
  enabled: true
  fsGroup: 2000
  fsGroupChangePolicy: "OnRootMismatch"
  runAsUser: 2000
  runAsGroup: 2000
  runAsNonRoot: true
  seccompProfile:
    type: "RuntimeDefault"

# Container-level security context. Read-only root filesystem, no privilege escalation, all capabilities dropped except NET_BIND_SERVICE (needed for privileged mail ports). Set `enabled: false` to omit it entirely.
containerSecurityContext:
  enabled: true
  allowPrivilegeEscalation: false
  privileged: false
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
    add: ["NET_BIND_SERVICE"]

# -- Metadata is merged without changing immutable selector labels.
additionalLabels: {}
additionalAnnotations: {}
# -- Extra labels on the mail pods. Selector labels are reserved and cannot be overridden.
podLabels: {}
# -- Extra annotations on the mail pods. `checksum/config` and `checksum/secret` are reserved.
podAnnotations: {}

# Dedicated ServiceAccount of the Stalwart pods. No API token is mounted and it has no RBAC.
serviceAccount:
  create: true
  name: ""
  annotations: {}
  labels: {}
  automountServiceAccountToken: false

# Always internal, independently of the mail Service's type.
management:
  port: 8080
  servicePort: 8080
  annotations: {}

# Prometheus scraping for Stalwart's built-in exporter, served on the
# internal management listener at metrics.path. `enabled` also drives
# the provisioning Job (see below) so the exporter is actually turned
# on inside Stalwart; `serviceMonitor.enabled` additionally renders a
# Prometheus Operator ServiceMonitor. Both flags are independent so an
# existing scrape setup can be reused.
metrics:
  enabled: false
  path: "/metrics/prometheus"
  # -- Reapplies the Metrics singleton on every install/upgrade via the
  # same CLI apply Job used for S3 provisioning. Disable if the
  # Prometheus exporter is already configured through the WebUI/CLI.
  provision: true
  # Optional Basic auth for the exporter. An internal Service alone does
  # not restrict which cluster workloads can access metrics.
  auth:
    username: ""
    existingSecret: ""
    passwordSecretKey: "password"
    # -- Fallback only, stored in a chart-managed Secret and visible in
    # Helm's release history. Prefer existingSecret.
    password: ""
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    annotations: {}
    interval: "30s"
    scrapeTimeout: ""
    honorLabels: false
    relabelings: []
    metricRelabelings: []

# Accounts choose their encryption key and encryptOnAppend setting outside this chart.
encryption:
  # -- Allows server-side encryption at rest for accounts that configured it.
  # Matches Stalwart's default; false disables this encryption for new messages.
  atRestEnable: true
  # -- Reapplies atRestEnable on every install/upgrade. Requires provisioning credentials.
  provision: false
  # Server-side blob encryption (Stalwart 1.0.3): Stalwart encrypts the message and file
  # blobs it writes with a symmetric key, so the blob store (e.g. the S3 provider) only holds
  # ciphertext. Unlike encryption at rest above, Stalwart can still read, index and search the
  # messages. Existing blobs stay unencrypted until a BlobRecode task rewrites them (see the
  # README). Setting existingSecret creates the key and requires provisioning credentials.
  blobKey:
    # -- Secret holding the key: 32 random bytes, base64-encoded (openssl rand -base64 32).
    # Keep a copy: blobs written with the key cannot be read without it.
    existingSecret: ""
    # -- Key in existingSecret that holds the key.
    secretKey: "key"
    # -- aes256Gcm or chacha20Poly1305. Do not change it, or the key in the Secret, once
    # the key exists: Stalwart then refuses to load it and cannot store new mail.
    cipher: "aes256Gcm"
    # -- Encrypts new mail blobs with the key. false stops encrypting new mail blobs.
    email: true
    # -- Encrypts new file storage (WebDAV) blobs with the key. false stops encrypting them.
    fileStorage: true

# Stalwart Enterprise edition: these settings need a paid Enterprise license from Stalwart Labs
# (sponsors on OpenCollective get one too). Without a valid license Stalwart logs a warning and
# runs as the community edition, ignoring them. Setting any of them requires provisioning
# credentials. Clearing a value later leaves the stored setting in place; change it in the WebUI.
# Stalwart reads the keys only at startup: after changing a Secret, restart the StatefulSet
# (kubectl rollout restart statefulset/<fullname>).
enterprise:
  # Licensing by API key (recommended): Stalwart downloads the license for its hostname, renews
  # it before it expires and stores it itself. Do not combine with licenseKey.
  apiKey:
    existingSecret: ""
    # -- Key in existingSecret that holds the API key.
    secretKey: "api-key"
  # A fixed license key, e.g. for a server without internet access; replace the Secret before
  # the license expires, then restart the StatefulSet. The license is bound to the server's
  # hostname (`hostname`).
  licenseKey:
    existingSecret: ""
    # -- Key in existingSecret that holds the license key.
    secretKey: "license-key"
  # -- Default logo of Stalwart's web interface (Enterprise only): a data URI
  # (data:image/svg+xml;base64,...), a base64-encoded image, or an http(s) URL, at most 1 MiB.
  # Domains and tenants can override it in the WebUI.
  logo: ""

# Delegates authentication to a third-party OpenID Connect provider
# (e.g. Keycloak). This is a resource-server integration: Stalwart
# validates bearer tokens against the provider's discovery document
# and JWKS, so no client secret is needed. Accounts can be created
# on first login, matched by claimUsername. Pre-create them to accept
# mail before the first login; the chart does not provision users.
oidc:
  enabled: false
  # -- Short label. Also used as the Directory object's natural key
  # (its "description" field), so re-applying doesn't create
  # duplicates, and as the CLI-apply cross-reference for activate.
  name: "keycloak"
  issuerUrl: ""
  # -- Audiences accepted in a token's `aud` claim besides Stalwart's own resource identifiers,
  # e.g. the client id an audience mapper in Keycloak adds.
  acceptedAudiences: []
  # -- Tokens carrying none of Stalwart's scopes (mail, contacts, calendars, files):
  # `reject` (Stalwart's default), `interoperable` (treated as carrying those four, no
  # management) or `full` (every permission of the account, including management; unsafe unless
  # the audience check is strict). Tokens from a provider like Keycloak usually carry none of them.
  unscopedTokens: "reject"
  claimUsername: "preferred_username"
  # -- Domain appended to claimUsername values that don't already contain "@".
  usernameDomain: ""
  claimName: "name"
  claimGroups: ""
  # -- Activates this directory server-wide via the Authentication
  # singleton's directoryId, replacing the internal directory for
  # every protocol (IMAP, POP3, SMTP, JMAP) -- not only WebUI/JMAP --
  # since Stalwart has no per-protocol override. Stalwart's
  # documentation does not confirm whether local/admin login keeps a
  # fallback once this is set. Verify WebUI/admin access still works
  # in a non-production environment before enabling this; leaving it
  # false only declares the Directory object without switching any
  # authentication over to it.
  activate: false

# Cluster coordination between replicas (mailbox updates, IMAP IDLE/push,
# blocked-IP and certificate events). Not needed for a single replica; with
# several, one of these must be configured. type "" (default) leaves the
# Coordinator singleton untouched, e.g. because it is set up in the WebUI.
# Otherwise it is applied on every install/upgrade by the provisioning Job
# (which then needs provisioning credentials). The chart does not deploy any
# coordinator: run NATS (plain pub/sub, no JetStream) with its own chart.
#   nats  -- medium clusters; lower latency and simpler than Kafka (recommended)
#   redis -- small/medium, mainly when Redis is already in use
#   kafka -- very large deployments
#   zenoh -- peer-to-peer, no extra service; needs a Stalwart build with the
#            zenoh feature (not in the default build per Stalwart's docs) and
#            multicast discovery rarely works on Kubernetes, so give it an
#            explicit-endpoints config
coordinator:
  type: ""
  # -- Confirms that, with type empty, the Coordinator is configured outside
  # Helm (e.g. in the WebUI). With more than one replica the chart requires
  # either a type or this flag, since uncoordinated replicas miss each
  # other's mailbox changes, IMAP IDLE/push and blocked-IP events.
  externallyManaged: false
  nats:
    hosts: []
    useTls: false
    authUsername: "stalwart"
    existingSecret: ""
    passwordSecretKey: "password"
    # -- Fallback only, stored in a chart-managed Secret and visible in Helm's
    # release history. Prefer existingSecret. Leave both empty for no auth.
    password: ""
  # Stalwart's plain Redis variant has no credential field: a password in the
  # URL would be stored in Stalwart's database in clear text.
  redis:
    url: ""
  kafka:
    hosts: []
    groupId: "stalwart"
  zenoh:
    config: ""

# In-memory store for caches, rate limits, locks and lookups. A single replica
# uses Stalwart's local in-process store. Several replicas must share a
# Redis-compatible store (Redis or Valkey), and Stalwart refuses a coordinator
# without one. type "" (default) leaves the InMemoryStore singleton untouched;
# "redis" applies it on every install/upgrade, before the coordinator. The
# chart does not deploy Redis.
inMemoryStore:
  type: ""
  # Stalwart's plain Redis variant has no credential field: a password in the
  # URL would be stored in Stalwart's database in clear text.
  redis:
    url: ""

# Bulwark (https://bulwarkmail.org): an optional, separate JMAP
# webmail client deployed alongside Stalwart as its own Deployment.
# Disabled by default. Mailbox authentication uses the JMAP server (Stalwart),
# either via basic auth/app passwords or, if webmail.oauth.enabled,
# via its own browser OAuth redirect flow.
webmail:
  enabled: false

  image:
    registry: "ghcr.io"
    repository: "bulwarkmail/webmail"
    # -- Image tag, kept in sync with the digest by Renovate.
    # @default -- pinned, see values.yaml
    tag: "1.21.1"
    # -- Multi-arch index digest of the tag. Takes precedence over the tag;
    # clear it to float on the tag instead.
    # @default -- pinned, see values.yaml
    digest: "sha256:53df0683b2c59870611073b425937999c859b3a51106ecda08ed41ee12d97a7d"
    pullPolicy: "IfNotPresent"
    pullSecrets: []

  # -- Multiple replicas require sharedStore, a pinned adminPassword and
  # sessionSecret, and no ReadWriteOnce persistence; see the README for moving
  # an existing installation onto a store.
  replicaCount: 1

  # -- Deployment strategy. Empty uses Recreate with a ReadWriteOnce volume,
  # which a new pod cannot attach while the old one holds it, and
  # RollingUpdate otherwise.
  strategy: {}

  # Scales replicaCount automatically; the same replicaCount caveats above
  # still apply to whatever value it settles on between min/max. Requires
  # resources.requests.cpu/memory for the utilization targets to mean
  # anything.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
    metrics: []
    behavior: {}

  # PodDisruptionBudget for the webmail Deployment. Rendered only when more
  # than one replica is possible (replicaCount, or autoscaling.maxReplicas,
  # above 1).
  pdb:
    # -- Create the PodDisruptionBudget for multi-replica installs.
    create: true
    # -- Pods that may be evicted at once. Ignored when minAvailable is set.
    maxUnavailable: 1
    # -- Pods that must stay available, as a number or percentage. Replaces
    # maxUnavailable when set; a value equal to the replica count blocks drains.
    minAvailable: ""

  # -- Browser-reachable JMAP URL. Empty falls back to the internal management
  # Service (plain HTTP); set the public URL for access from outside the cluster.
  jmapServerUrl: ""
  appName: ""

  # Logos, icons, colours and the login page. Logo, icon and background settings take an
  # https URL or a path on the webmail host: files from files/binaryFiles/existingConfigMap are
  # served at /branding/custom/<name>. Settings changed in Bulwark's admin dashboard
  # (Admin > Branding) take precedence over these. Empty values keep Bulwark's defaults.
  branding:
    # -- Text files served at /branding/custom/<name>, e.g. an SVG logo:
    # {logo.svg: "<svg ...>"}. Changes restart the webmail pods.
    files: {}
    # -- Binary files (PNG, JPEG, ICO) served at /branding/custom/<name>, base64-encoded.
    binaryFiles: {}
    # -- Existing ConfigMap whose keys are served at /branding/custom/<key>, instead of
    # files/binaryFiles. Restart the webmail pods after changing it.
    existingConfigMap: ""
    # -- Short name, e.g. the home screen label of the installed app. Defaults to appName.
    shortName: ""
    # -- Browser tab icon, e.g. /branding/custom/favicon.svg.
    favicon: ""
    # -- Source image of the installed app's icons. Defaults to favicon.
    pwaIcon: ""
    # -- Browser UI colour of the installed app, e.g. #571efa.
    themeColor: ""
    # -- Splash screen colour of the installed app.
    backgroundColor: ""
    # Logo in the sidebar after login. Empty shows none.
    appLogo:
      light: ""
      dark: ""
    login:
      # Logo on the login page; dark falls back to Bulwark's logo, not to light.
      logo:
        light: ""
        dark: ""
        # -- Caps the rendered size, as a CSS length (e.g. 96px).
        maxHeight: ""
        maxWidth: ""
      # -- centered (form in a card) or split (form in a side panel). Empty is centered.
      layout: ""
      # Background picture; dark falls back to light.
      background:
        light: ""
        dark: ""
        # -- Dims the picture, in percent (0 to 80).
        dim: ""
        # -- Blurs the picture, in px (0 to 24).
        blur: ""
      # -- Shown above the version number.
      companyName: ""
      websiteUrl: ""
      imprintUrl: ""
      privacyPolicyUrl: ""
    # Colours of Bulwark's built-in look, as hex colours: primary, primary-foreground, accent
    # and accent-foreground for each mode. Applied to the webmail's own hostnames (the
    # HTTPRoute's hostnames, else the Ingress host or webmail.<domain>). A theme a user picks,
    # or the default theme set in the admin dashboard, still overrides them.
    palette:
      light: {}
      dark: {}
    # -- Branding per hostname (Bulwark's DOMAIN_BRANDING), for other hostnames or
    # different values, e.g. [{host: mail.example.org, loginCompanyName: Example,
    # palette: {light: {primary: "#0b3d91"}}}]. An exact entry for a webmail hostname replaces
    # the palette entry above; a matching wildcard entry (*.example.org) is merged into it, its
    # own palette colours winning.
    domains: []
  # -- Enables Stalwart-specific WebUI features (password change, Sieve
  # management, vacation responder, account security, API keys, admin
  # dashboard). Matches Bulwark's own default.
  stalwartFeatures: true
  # -- Reverse proxies in front of the pods that append X-Forwarded-For: 1 for an
  # ingress controller or Gateway alone, 2 with a cloud load balancer in front of
  # it. Sign-in limits and the audit log use the client address this selects.
  trustedProxyDepth: 1
  # -- `text` or `json` (for log aggregation).
  logFormat: "text"
  # -- `error`, `warn`, `info` or `debug`.
  logLevel: "info"

  # Encrypts sessions, synced settings, multi-account and OAuth PKCE state.
  # Bulwark generates one if unset; pin it explicitly for multiple replicas.
  # Preserve the existing secret when migrating (see README). For a new install:
  # openssl rand -base64 32. All replicas need the same value, at least 32 characters.
  sessionSecret:
    existingSecret: ""
    secretKey: "SESSION_SECRET"
    # -- Fallback only, stored in a chart-managed Secret and visible in
    # Helm's release history. Prefer existingSecret.
    value: ""
  # Needs persistent state to be useful across restarts/replicas: requires
  # persistence.enabled or sharedStore.
  settingsSync:
    enabled: false

  # External Redis-protocol store for admin config, sessions, settings, plugins
  # and sign-in limits (Bulwark 1.20+). Required for multiple replicas; no shared
  # volume is needed. Use persistence, maxmemory-policy noeviction and backups.
  # Leave both URL sources empty for local mode (/app/data). See README for migration.
  sharedStore:
    # -- Existing Secret with the full URL, e.g. redis://:password@valkey:6379/0
    # (rediss:// for TLS).
    existingSecret: ""
    secretKey: "REDIS_URL"
    # -- Fallback only, stored in a chart-managed Secret, since the URL usually
    # carries the password. Prefer existingSecret.
    url: ""
    # -- Key prefix (REDIS_KEY_PREFIX). Empty keeps Bulwark's default
    # "bulwark:"; set one per release when several share a store.
    keyPrefix: ""

  # Explicit password for Bulwark's local admin dashboard, separate from
  # Stalwart accounts. Required by the chart when scaling above one replica.
  # Dashboard sessions also require sessionSecret.
  adminPassword:
    existingSecret: ""
    secretKey: "ADMIN_PASSWORD"
    value: ""

  # OAuth2/OIDC login for Bulwark's own browser redirect flow. This is
  # a DIFFERENT integration than the top-level `oidc` block: `oidc`
  # lets Stalwart validate bearer tokens from clients that already
  # have one; this lets Bulwark itself send users to the identity
  # provider to obtain one. The two are commonly pointed at the same
  # Keycloak realm but need their own registered OAuth client
  # (clientId/clientSecret) in Keycloak, distinct from Stalwart's
  # client-secret-free resource-server integration.
  oauth:
    enabled: false
    # -- Defaults to the top-level oidc.issuerUrl when unset and oidc.enabled.
    issuerUrl: ""
    # -- Hides the username/password form, making OAuth the only login method.
    only: false
    # -- Starts the OAuth redirect automatically with no user interaction.
    # Requires only: true.
    autoSso: false
    # -- Keeps a "Sign in with a password" link next to single sign-on, so SSO and
    # password accounts work side by side. Requires only: true.
    passwordFallback: false
    clientId: ""
    # -- Client secret for a confidential client. Leave existingSecret and
    # clientSecret empty for a public client, which uses PKCE only.
    existingSecret: ""
    clientSecretKey: "OAUTH_CLIENT_SECRET"
    # -- Fallback only, stored in a chart-managed Secret. Prefer existingSecret.
    clientSecret: ""
    scopes: ""
    extraScopes: ""
    # -- Signing out also signs out of the identity provider (RP-initiated
    # logout). Set false when the provider's session is shared with other apps
    # that should stay signed in.
    endSession: true
    # -- Logout URL (https) for providers whose discovery document has no
    # end_session_endpoint, such as Stalwart's built-in provider.
    endSessionUrl: ""
    # -- Where the provider sends the browser after logout, e.g.
    # https://webmail.example.org/en/login. Register it at the provider first.
    postLogoutRedirectUri: ""

  # Disable Bulwark telemetry. This does not disable other outbound traffic.
  telemetry:
    enabled: true

  service:
    type: "ClusterIP"
    port: 3000
    annotations: {}
    # -- See the top-level service.ipFamilyPolicy.
    ipFamilyPolicy: ""
    ipFamilies: []

  # Bulwark's NEXT_PUBLIC_BASE_PATH is a build-time setting baked into
  # the published image's static assets, so it cannot be safely
  # reconfigured at runtime -- serve it from a dedicated host, not a
  # path prefix behind an existing Ingress or Gateway.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # -- Defaults to "webmail.<domain>" when empty and top-level domain
    # is set; required explicitly otherwise.
    host: ""
    tls: []

  # Route attaches to an existing Gateway instead of an Ingress
  # controller; install Gateway API CRDs and a controller first. Not
  # mutually exclusive with `ingress` above, but normally only one is
  # needed.
  gatewayAPI:
    httpRoute:
      enabled: false
      annotations: {}
      # -- Each reference names a Gateway; namespace and sectionName are optional.
      parentRefs: []
      # -- Defaults to a single "webmail.<domain>" hostname when empty and
      # top-level domain is set; required explicitly otherwise.
      hostnames: []

  # Keeps local /app/data (admin config, plugins, branding, audit and synced settings)
  # across pod replacements. Multiple replicas use sharedStore instead.
  persistence:
    enabled: false
    # -- Mount this PersistentVolumeClaim instead of creating one, e.g. a restored
    # snapshot or a statically provisioned volume. size, storageClass and annotations
    # then do not apply; set accessMode to the claim's mode.
    existingClaim: ""
    accessMode: "ReadWriteOnce"
    storageClass: ""
    # -- Local state capacity. Preserve the current PVC size on upgrades;
    # Kubernetes cannot shrink claims (the previous default was 2Gi).
    size: "1Gi"
    # -- E.g. helm.sh/resource-policy: keep, so the volume survives when
    # persistence is disabled after moving to sharedStore.
    annotations: {}

  # -- Prevent admin config writes. Requires a pre-seeded admin.json;
  # otherwise Bulwark cannot bootstrap the dashboard password.
  adminConfigReadonly: false

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"

  podSecurityContext:
    enabled: true
    # -- The published image's non-root user (nextjs, UID 1001); adjust if a
    # custom image uses a different UID/GID.
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"

  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    privileged: false
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false

  startupProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  additionalLabels: {}
  additionalAnnotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  # -- Explicit affinity always wins over podAntiAffinityPreset below.
  affinity: {}
  # -- Spreads replicas across nodes when affinity is left empty: "", "soft",
  # or "hard" -- see the top-level podAntiAffinityPreset for details.
  podAntiAffinityPreset: ""
  tolerations: []
  # -- Extra environment variables for anything not exposed as its own
  # value above (branding, PWA icons, cookie/CSP settings, locale, etc.)
  # -- see bulwarkmail.org's environment reference.
  extraEnv: {}
  extraEnvVars: []
  extraVolumes: []
  extraVolumeMounts: []
  # -- Extra init containers for the webmail pod, e.g. to seed /app/data.
  extraInitContainers: []

# Startup probe on `/healthz/live` of the management port. Allows up to ten minutes of startup before liveness checks begin.
startupProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
  successThreshold: 1
# Liveness probe on `/healthz/live` of the management port.
livenessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
# Readiness probe on `/healthz/ready` of the management port.
readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# -- Seconds the pod gets to shut down cleanly. Stalwart needs time to drain connections.
terminationGracePeriodSeconds: 60
# -- OrderedReady starts/stops pods one at a time, each waiting for readiness
# (the startup probe allows up to ten minutes), so an HPA scale-up is
# serial. Parallel starts them together; with an external DataStore and
# no per-replica local state that is safe and much faster to scale.
# Immutable on an existing StatefulSet -- changing it on a live release
# means deleting the StatefulSet (e.g. --cascade=orphan) and upgrading.
podManagementPolicy: "OrderedReady"
# StatefulSet update strategy. Rolling updates by default.
# -- RollingUpdate without a partition whenever settings are provisioned: the reconcile Job
# applies them by a rolling restart and waits for every pod.
updateStrategy:
  type: "RollingUpdate"
# -- Node selector for the mail StatefulSet.
nodeSelector: {}
# -- Explicit affinity always wins over podAntiAffinityPreset below.
affinity: {}
# -- Spreads replicas across nodes when affinity is left empty: "", "soft"
# (preferred, default topologyKey kubernetes.io/hostname), or "hard"
# (required -- extra unschedulable replicas rather than co-located ones).
podAntiAffinityPreset: ""
# -- Tolerations for the mail StatefulSet.
tolerations: []
# -- Topology spread constraints for the mail StatefulSet. Use for zone-level spreading; `podAntiAffinityPreset` only covers nodes.
topologySpreadConstraints: []
# -- Extra environment variables injected into the container, for
# non-sensitive settings. Overrides chart-generated values; extraEnvVars takes precedence.
extraEnv: {}

# -- Extra environment variables injected from the managed Secret.
# Use this for anything sensitive (database passwords, S3 keys, etc.).
extraSecretEnv: {}

# -- Extra environment variables as Kubernetes `env` entries (for example `valueFrom.secretKeyRef`). Overrides extraEnv and chart-generated values. Names must be unique; list order is preserved.
extraEnvVars: []
# -- Extra volumes for the mail pod, for example a mounted certificate or a writable path for custom logging.
extraVolumes: []
# -- Mounts for `extraVolumes` in the mail container.
extraVolumeMounts: []
# -- Extra init containers for the mail pod.
extraInitContainers: []
# -- Extra /etc/hosts entries for the mail pod, e.g. when cluster DNS does not resolve a host it
# must reach.
hostAliases: []
# -- Lifecycle hooks for the mail container.
lifecycleHooks: {}
...
